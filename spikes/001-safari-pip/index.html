<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DQWメモ PiP実用性検証</title>
  <style>
    body { background: #121214; color: #f3f4f6; padding: 16px; font-family: sans-serif; }
    .card { background: #1e1e24; border: 1px solid #374151; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    .btn { background: #3b82f6; color: white; padding: 16px; width: 100%; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 8px; }
    .btn-update { background: #10b981; }
    .log-box { background: #0c0c0e; border: 1px solid #374151; padding: 8px; font-family: monospace; font-size: 0.8rem; height: 200px; overflow-y: auto; }
    .log-entry { border-left: 2px solid #3b82f6; padding-left: 6px; margin-bottom: 4px; }
  </style>
</head>
<body>
<div class="card">
  <h2>PiP 実用性検証</h2>
  <div id="status">ステータス: 準備完了</div>
</div>
<div class="card">
  <button id="btn-update" class="btn btn-update">メモを更新して反映</button>
  <button id="btn-pip" class="btn">PiPで小窓表示を開始する</button>
</div>
<div class="log-box" id="log-box"></div>
<canvas id="memo-canvas" width="640" height="320" style="display:none;"></canvas>
<video id="pip-video" muted playsinline></video>

<script>
  const canvas = document.getElementById('memo-canvas');
  const ctx = canvas.getContext('2d');
  const video = document.getElementById('pip-video');
  const btnPip = document.getElementById('btn-pip');
  const btnUpdate = document.getElementById('btn-update');
  const statusEl = document.getElementById('status');
  const logBox = document.getElementById('log-box');

  let updateCount = 0;
  let memoContent = [
    "【竜王戦 攻略メモ】",
    "・1T：防御 ＋ 守りの盾",
    "・2T：魔法バフ・全体回復",
    "・3T：攻勢（雷光さみだれ突き）",
    "・4T：守備低下に備えてスカラ"
  ];

  function addLog(msg) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(entry);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function drawCanvas() {
    ctx.fillStyle = '#1e1e24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);

    ctx.fillStyle = '#f3f4f6';
    ctx.font = '24px sans-serif';
    ctx.textBaseline = 'top';

    memoContent.forEach((line, i) => {
      ctx.fillText(line, 30, 40 + i * 40);
    });
    ctx.fillText(`更新回数: ${updateCount}`, 30, 260);
    addLog(`Canvas描画更新: ${updateCount}`);
  }

  // 初回描画
  drawCanvas();

  // ストリーム設定
  const stream = canvas.captureStream(30);
  video.srcObject = stream;
  addLog('Canvas.captureStream設定完了');

  btnUpdate.addEventListener('click', () => {
    updateCount++;
    memoContent = [
      "【竜王戦 攻略メモ】",
      `・1T：変更テスト成功 (${updateCount})`,
      "・2T：メモ内容を更新",
      "・3T：PiPへ反映確認",
      "・4T：実用性検証中"
    ];
    drawCanvas();
    addLog(`メモを更新しました: ${updateCount}`);
  });

  btnPip.addEventListener('click', async () => {
    try {
      await video.play();
      if (video.webkitSetPresentationMode) {
        video.webkitSetPresentationMode('picture-in-picture');
      } else if (video.requestPictureInPicture) {
        await video.requestPictureInPicture();
      }
      addLog('PiP要求完了');
    } catch (e) {
      addLog(`PiP失敗: ${e.message}`, 'error');
    }
  });

  ['enterpictureinpicture', 'leavepictureinpicture', 'webkitpresentationmodechanged'].forEach(evt => {
    video.addEventListener(evt, () => {
        statusEl.textContent = `ステータス: PiP ${evt}`;
        addLog(`EVENT: ${evt}`);
    });
  });
</script>
</body>
</html>
